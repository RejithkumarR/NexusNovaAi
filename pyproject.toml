[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-ai"
version = "0.1.0"
description = "NOVA - Neural Omni-modal Virtual Assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
ml = [
  "torch>=2.6,<3",
  "transformers>=4.49,<5",
  "accelerate>=1.3,<2",
  "safetensors>=0.5,<1",
]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
